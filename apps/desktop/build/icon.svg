<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272d38"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aacfa"/>
      <stop offset="1" stop-color="#3d86e8"/>
    </linearGradient>
  </defs>
  <!-- graphite tile with a hairline rim -->
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#tile)"/>
  <rect x="42" y="42" width="940" height="940" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="10"/>
  <!-- film strip tracks -->
  <g>
    <rect x="128" y="172" width="768" height="108" rx="24" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="128" y="744" width="768" height="108" rx="24" fill="#ffffff" fill-opacity="0.14"/>
    <g fill="#14171d" fill-opacity="0.9">
      <circle cx="208" cy="226" r="26"/><circle cx="308" cy="226" r="26"/><circle cx="408" cy="226" r="26"/>
      <circle cx="508" cy="226" r="26"/><circle cx="708" cy="226" r="26"/><circle cx="808" cy="226" r="26"/>
      <circle cx="208" cy="798" r="26"/><circle cx="308" cy="798" r="26"/><circle cx="408" cy="798" r="26"/>
      <circle cx="508" cy="798" r="26"/><circle cx="708" cy="798" r="26"/><circle cx="808" cy="798" r="26"/>
    </g>
  </g>
  <!-- the play triangle -->
  <path d="M 340 352 L 340 672 L 600 512 Z" fill="url(#accent)" stroke="#14171d" stroke-opacity="0.35" stroke-width="10" stroke-linejoin="round"/>
  <!-- timeline playhead crossing the strips -->
  <rect x="652" y="96" width="18" height="832" rx="9" fill="#4f9cf9" fill-opacity="0.95"/>
</svg>
